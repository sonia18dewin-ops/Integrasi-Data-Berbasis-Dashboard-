async function cuImport(m,file){try{const n=file.name.toLowerCase();let g;

  else if(/\.json$/.test(n)){let j=JSON.parse(await file.text());if(!Array.isArray(j))j=Object.values(j).find(Array.isArray)||[];const ks=[...new Set(j.flatMap(r=>Object.keys(r)))];g=[ks].concat(j.map(r=>ks.map(k=>r[k]==null?'':r[k])))}
  else if(/\.(csv|tsv|txt)$/.test(n))g=pCSV(dec(new Uint8Array(await file.arrayBuffer())));else throw new Error('Gunakan .xlsx, .csv atau .json');
  g=(g||[]).filter(r=>r.some(x=>x!==''&&x!=null));if(g.length<2)throw new Error('Berkas tidak berisi data.');

 if(W){const wg=W.g,wh=W.hr,sub=wg[wh+2]||[],top=wg[wh]||[],C={};
  top.forEach((c,i)=>{const n=skNorm(c),m={desa:/^desakelurahan$/,no:/^nourutsampel/,jenis:/^klasifikasi/,jml:/^jumlahanggotarumahtangga/,usia:/^usiaresponden/,bb:/^beratbadan/,rtrw:/^rtrw$/};for(const k in m)if(C[k]==null&&m[k].test(n)){C[k]=i;return}});

   WM[key(row[C.desa],row[C.no])]={jenis:T(row[C.jenis]),kk:N(row[C.jml]),usia:N(row[C.usia]),bb:N(row[C.bb]),rtrw:T(row[C.rtrw]),jk:mk(row,OJ)[0]||'',pend:mk(row,OP),kerja:mk(row,OK),peng:mk(row,OG),lok:mk(row,OL)[0]||''}}}
 const out=[];let skip=0;const cap=s=>s.toLowerCase().replace(/(^|\s)\S/g,x=>x.toUpperCase());
